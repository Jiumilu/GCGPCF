compatibility:
  mode: additive_envelope
  extends_contract: okf/knowledge-object.schema.json
  domain_policy: okf/domain-policy.yaml
  rule: KnowledgeAssetEnvelope 增加项目群上下文，不替代 KDS canonical KnowledgeObject。
  canonical_linkage:
    reference_match: id_or_uri
    invariant_fields: [tenantId, sourceRefs, evidenceRefs, lineageRefs]
    object_type_mapping: okf/knowledge-asset-vocabulary.yaml#asset_type_compatibility
    space_domain_mapping: okf/knowledge-asset-vocabulary.yaml#dimensions.access_space
  projection_contract:
    modes: [reference_only, redacted_projection, approved_copy]
    redacted_requires: [projectionLineageRefs]
    approved_copy_requires: [projectionLineageRefs, approvalEvidenceRefs, derivedKnowledgeObjectRef]
    derived_ref_must_differ_from_canonical: true
    derived_object_must_resolve_to: id_or_uri
    derived_invariants: [tenantId, sourceRefs, projectionLineageRefs, confirmationStatus=human_confirmed]
  semantic_invariants:
    public_primary_confidentiality: public
    timestamps: updated_at_not_before_created_at
    relations: no_self_reference
    projections: [not_primary_space, unique_target]
    controlled_tags: resolve_in_declared_vocabulary_version

