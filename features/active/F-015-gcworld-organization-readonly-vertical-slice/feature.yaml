id: F-015
name: gcworld-organization-readonly-vertical-slice
project: studio
status: active
goal: 基于版本化KDS快照交付GCWORLD组织资产总览、资产详情、关系图谱和项目运行事项只读闭环
owner: Studio
priority: P0
scope:
  in:
    - Studio内新增GCWORLD组织资产总览、资产详情与关系图谱只读路由
    - 使用已密封的938项候选分层清单生成版本化服务端私有快照，前端通过受保护读取展示
    - 候选、正式与模拟状态的可见隔离及中文解释
    - 搜索、主体类型筛选、资产选择与来源摘要查看
    - 从KDS不可变HEAD读取项目注册表并展示项目状态、负责人、截止日期、下一行动与最近会议
    - 项目完整详情、明确父子项目标识跳转、可恢复深链接与返回时筛选及焦点保持
    - 展示同一历史注册表中17项项目的相关方或联系人登记，支持用户输入名称查找候选并返回原项目
    - 在28项项目登记上按有无行动及精确负责人组合筛选，应用后支持刷新与详情返回保持
    - 基于同一快照显示登记更新时间、计划截止与会议引用，明确日期排序、未知时间分离且可核对来源
    - 在项目详情提供来源绑定的本地规则整理、可编辑标签页草稿、保存恢复与清空撤销，不产生真实任务或外部动作
    - 对既有快照实施版本与来源元数据校验，分离世界类型与确认状态，提供加载失败恢复与可重建只读投影
    - 按稳定标识比较快照中的新增、修改、对照未收录及来源变化，隔离测试版本不混入真实数据，返回原工作台保留编辑
    - 资产清单单一键盘入口、详情与来源聚焦、刷新及返回筛选和位置保持，移动端直接阅读与无效标识恢复
    - 本地待办与行动核对反馈独立保存，支持类型切换保留编辑、项目及版本隔离、损坏重试与退出清除
    - 逐项展开候选、来源与关系证据汇总，解释缺失项，按明确同名分组定位并刷新返回原候选
    - 依据双向一致的父子项目标识浏览历史层级，查找保留祖先上下文，异常连接隔离且详情返回恢复定位
    - 五个任务入口连接资产、项目行动、层级、详情与关系，项目行动历史辅助可直达且本地切换不丢未保存草稿
    - 当前标签页草稿入口沿用项目筛选，区分待办与反馈，定位正确编辑器，保存清空及退出同步更新索引
    - 固定快照的受保护读取接口：默认拒绝、精确主体与租户及数据包授权、短期续验、禁止缓存、拒绝恢复及退出清除；仅本地隔离验证
    - 在项目详情逐条核对历史父子关系的双端字段定位与来源，标明未知有效时间，详情和层级共用异常隔离规则
    - 在现有快照适配和项目详情中消费可选候选关系包，核对稳定端点及未决提及、来源版本、有效时间和状态，支持候选档案刷新返回；本轮仅隔离测试验证
    - 按独立摘要授权从私有目录只读加载候选关系包，前后端共用契约并复核授权撤销；真实文件与本地HTTP验证，不扩大真实授权
    - 候选关系纳入现有快照比较，按稳定标识显示端点、状态、日期与逐条来源差异；不可比关系隔离，不推断真实删除
    - 当前项目候选关系按端点、类型及标识查找并组合确认状态，支持分段核对和候选往返条件恢复，不改变投影或草稿
    - 当前候选的一跳有向图与逐条来源核对，按明确资产标识展示方向和未决对端，6条分页与返回焦点，不新增真实数据或身份
    - 从关系图明确对端进入候选或项目，刷新返回原图分组与焦点，保持筛选及项目上下文，校验返回来源并沿用草稿离开保护
    - 项目双类草稿的原生浏览器刷新关闭保护，隐藏草稿参与判定，保存和会话失效移除监听
    - 登录、401重认证及默认凭据整改后返回组织世界原项目并保持中文筛选，只允许内部目标且不绕过认证
  out:
    - KDS文件、数据库、API或业务系统写入
    - 身份自动合并、正式事实生成、事实提升或权限授予
    - 生产部署、对外发布、提交、推送或状态提升
acceptance:
  - 用户登录、过期重认证或完成默认凭据整改后返回原项目及中文筛选；失败口令不丢目标，外部及错误前缀安全回退
  - 两类未保存草稿刷新或关闭时提示，取消后保留编辑，确认刷新仅恢复已保存版本；保存、撤权及卸载后解除保护，不自动保存或扩大存储
  - 用户可以搜索和筛选938项组织资产候选
  - 用户可以查看资产画像、状态、来源摘要和待确认原因
  - 用户可以查看不冒充正式业务关系的可追溯候选关系图
  - 用户可以在同一页面查找28项项目登记并核对下一行动，且登记状态不冒充当前事实
  - 用户可以从登记相关方查找同名候选并返回原项目，查找不生成身份认定或项目关系
  - 用户可核对18项有行动、10项缺行动的项目登记，按负责人缩小范围，空结果可恢复且不推断完成状态
  - 用户可查看项目登记时间线、追溯原字段与版本，不从文件名或条件截止推断事件日期及完成状态
  - 用户可将核对建议加入草稿，保存刷新、切换项目隔离、撤销清空，并在失败或退出时获得正确反馈和清除
  - 无效版本、来源及确认状态不进入工作台，重新加载可恢复项目和查找；候选不作为世界类型，原始快照不变
  - 快照比较可查看字段前后值、筛选、反向比较及错误恢复，不按名称合并、不将缺失等同删除，返回后未保存草稿仍保留
  - 用户可用方向键查找并打开资产、查看完整来源摘要、刷新和返回原位置，移动端长名称可读，无效标识不替换为其他资产
  - 单元测试、构建、浏览器任务流和Studio Harness门禁形成证据
  - 用户可核对原行动并记录未确认反馈，刷新恢复且不覆盖待办，隐藏的未保存反馈仍受离开保护，不改变项目登记状态
  - 用户可查看已有证据摘要及缺失内容，零条不推断现实不存在关系，同名定位返回保留上下文且拒绝跨组返回
  - 用户可在28项登记中核对2条父子连接、打开详情及来源并刷新返回，移动草稿保护有效，异常登记不制造关系
  - 用户可在移动端持续访问任务入口，按键盘定位行动、历史及辅助，重新查找资产保持筛选且目标不被导航遮挡
  - 用户可找到当前快照的本地草稿并继续编辑，刷新保留项目和类型定位，重复进入可聚焦，损坏和旧版本不冒充有效记录
  - 私有快照不进入公开前端构建；未获授权不返回数据，续验不丢编辑，拒绝、到期与退出移除旧投影；本地验证不等于真实用户获准
  - 用户可沿一致父子登记核对双端依据并跳转返回，矛盾登记不生成正常关系入口，未知时间及待核验不提升为现实事实
  - 用户可查看有界候选关系、打开明确标识对应的候选并刷新返回原项目；未知端点不自动绑定、冲突不降低，无效包不回显内容且原项目仍可查看
  - 隔离关系文件可经精确授权与真实本地HTTP交由客户端解析；旧授权及请求参数不能扩权，错误摘要、私有权限或授权失效不返回数据
  - 实际本地HTTP进入浏览器关系来源与候选往返；关系范围撤回但基础权限仍有效时清除旧投影及草稿，同范围续验保留编辑
  - 用户可筛选候选关系变化、核对字段前后值和来源、反向比较并返回原草稿；缺包不当删除，独立关系包不绕过基础快照不可变约束
  - 用户可查找本项目关系、清除空结果、键盘继续加载、核对来源并往返候选档案；条件不跨项目或快照恢复，筛选不触发草稿丢失
  - 用户可区分指向当前、从当前出发和自关联，核对完整两端及来源、分页返回原连接；移动标签不重叠，项目草稿保持，无效包不进入图中
  - 用户可从图中进入关联候选或项目并刷新返回原分组和焦点；未决自关联无跳转，失效或伪造来源不提供返回，普通导航清除旧来源，取消离开保留未保存草稿
