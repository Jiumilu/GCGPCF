  - 候选关系消费契约和明确标识导航已本地验证；真实人员组织项目关系资料、逐条权威依据及第二真实版本仍缺，不以隔离测试冒充真实试点，不阻断独立开发
  - 真实业务接口、完整无障碍和多用户可用性尚未验证；不阻断当前本地只读流程，不允许据此发布或提升状态
