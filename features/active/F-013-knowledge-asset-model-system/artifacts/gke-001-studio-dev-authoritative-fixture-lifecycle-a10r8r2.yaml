    - Deleting the fixture must immediately make canonical Search and Read authority resolution fail closed before any KDS or MMC call.
    - Normal production and switch-disabled canonical bridge behavior must remain unchanged and must never consult the fixture database.
    - LR-879 must reference the source-changing A10R8 CodeGraph evidence and make Studio LOOP and Harness select source-capable evidence.
    - No real KDS, MMC, Hermes, browser, external network, default Studio database, knowledge intake or business-state write is permitted.
