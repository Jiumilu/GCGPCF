      missing_if_match: 428_MMC_POLICY_PRECONDITION_REQUIRED
      malformed_if_match: 400_MMC_POLICY_PRECONDITION_INVALID
      stale_or_concurrent_if_match: 409_MMC_POLICY_CONFLICT
      audit_or_storage_failure: 503_MMC_POLICY_MUTATION_UNAVAILABLE
    serialization:
      requirement: serialize_load_compare_audit_replace_and_recovery_across_concurrent_file_mode_mutations
      lock_scope: exact_STATE_PATH
      compare_must_happen_after_lock_acquisition: true
    atomic_state_write:
      requirement: same_directory_temporary_file_fsync_atomic_replace_and_parent_directory_fsync
      direct_Path_write_text: forbidden
      temporary_file_cleanup_on_every_failure: required
    audit_protocol:
      storage: dedicated_append_only_JSONL_test_redirectable_path
      events:
        - prepare
        - commit
        - rollback
      sequence: prepare_then_atomic_replace_then_commit
      commit_failure: atomically_restore_previous_state_then_append_rollback_then_return_503
      prepare_failure: leave_previous_state_effective_and_return_503
      replace_failure: leave_or_restore_previous_state_append_rollback_and_return_503
      safe_fields:
        - event
        - timestamp
        - correlation_id
        - service_key_id
        - role
        - api_id
        - space
        - expected_fingerprint
        - previous_fingerprint
        - target_fingerprint
        - outcome
        - bounded_error_code
      forbidden_fields:
        - delegated_operations
        - path_patterns
        - raw_request_body
        - authorization
        - token
        - signature
        - credential
