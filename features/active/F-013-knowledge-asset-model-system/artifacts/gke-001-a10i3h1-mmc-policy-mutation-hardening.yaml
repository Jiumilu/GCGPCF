  mutation_boundary:
    applies_when: ApiPatch.delegated_operations_is_present
    endpoint: PATCH_/api/mmc/v1/registry/apis/{api_id}?space={space}
    principal_source: request.state.mmc_principal
    allowed_direct_roles:
      - admin
      - super_admin
    correlation_header:
      name: X-Correlation-ID
      required: true
      minimum_length: 1
      maximum_length: 255
    compare_and_swap:
      header: If-Match
      exact_format: '"sha256:<64-lowercase-hex>"'
      fingerprint_algorithm: sha256_of_json_dumps_delegated_operations_ensure_ascii_true_sort_keys_true_compact_separators_preserve_array_order
      evaluate_inside_serialized_mutation_boundary: true
      success_response_etag: '"sha256:<target-64-lowercase-hex>"'
    deterministic_failures:
