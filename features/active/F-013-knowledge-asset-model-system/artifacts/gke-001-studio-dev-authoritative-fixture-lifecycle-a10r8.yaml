    - Fixture data uses an explicitly supplied disposable SQLite database path and must never fall back to the default Studio database.
    - Create returns a bounded redacted receipt; read proves exact binding; delete returns a deletion receipt and a later read proves absence.
    - No route or cleanup path calls KDS, MMC, Hermes deletion, intake, search, read, upload, or any external service.
    - Duplicate create, unauthorized role, wrong tenant, disabled environment, missing disposable database, and post-delete read are covered by tests.
