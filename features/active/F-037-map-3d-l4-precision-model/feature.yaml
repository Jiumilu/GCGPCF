id: F-037
name: map-3d-l4-precision-model
project: spaceai
status: active
goal: 三维地图 L4 精模升级：三园区优先、真实/占位资产三处标注、白盒模型可切换；资产规范/清单/BFF、引擎能力、精度模型与切换回落、接入工具链、一键验收、SIMULATED 演练、CI 门禁全部落地。真实 L4 资产待授权接入；仅本地开发，不 push 不部署。
owner: agent-dev-01
priority: P1
scope:
  in:
  - 口径与资产规范：docs/3d/l4-model.md（L4 定义、3D Tiles 1.1 + glTF 2.0 规范、清单 schema、source=real/placeholder 必填、license 必填、贴地 heightOffset、三园区范围）
  - 资产清单与 BFF：data/rebuild/l4/manifest.json + GET /RestFul/Rebuild/Tileset（清单持久读与内存登记表合并，返回 manifest 路径/时间/条数）
  - 引擎能力：unisecEngine 的 tilesetAdd / tilesetSetAllVisible / tilesetSetVisible / tilesetGroundClamp（贴地校准）
  - 精度与切换：panorama/modelPrecision.ts 纯逻辑（154 行）+ useModelPrecision.ts（加载/切换/回落/降级，172 行）；localStorage 记忆；清单异常自动回落白盒
  - UI：图层菜单「模型精度 L4 精模/白盒」；真实/占位三处标注（菜单、资产信息、文档）
  - 接入工具链：tools/l4 的 validate-tileset / import-asset / switch-asset（校验、导入、启停、回滚；dry-run 与 --apply）
  - 一键验收：tools/l4 acceptance.mjs + acceptance-lib.mjs；CI 门禁 .github/workflows/l4-acceptance.yml（单元 / 工具链 / 验收三段）
  - SIMULATED 演练：tools/db/gen-l4-sim-asset.mjs 生成 162 栋演练资产并跑全流程（生成/校验/导入/上线/回落/回滚）
  - 采购与自采准备：l4-procurement-spec / l4-self-collect-plan / l4-pilot-factory-package 与 RFQ 模板、比价表（暂停执行，待授权）
  - 真实资产验收入口（2026-10-23）：docs/3d/l4-vendor-dataset-spec.md（交付包规格与三路径授权点）+ tools/l4/verify-vendor-package.mjs（pass/needs_human/fail 判定，不宣称精度达标）+ DRY-RUN 证据
  - 不依赖 UI 的全链路演练（2026-10-23）：tools/l4/chain-dryrun.mjs（生成→验包→导入 dry-run+apply→校验→切换→回滚；临时 manifest，不触线上）
  out:
  - 不接入真实 L4 资产：采购与自采均暂停（2026-10-22 老卢决定），不做对外询价、不飞行、不采购
  - 不含室内细节（CityGML LOD4 室内另立范围）
  - 不改数据库 schema、不部署、不 push、不动生产数据
  - 重建算力仍为 stub，不做真实三维重建与供应商质检
acceptance:
  - 三园区占位 / SIMULATED 资产可加载、可切白盒、可回切 L4；清单异常（500）时自动回落白盒，mode=whitebox
  - 一键验收 report.json 0 fail（PASS ×2：smoke-sim 60 FPS、smoke-demo 56 FPS）
  - 贴地偏移 ≤0.2m（实测 0m）；L4↔白盒画面差异 ≥1%（实测 4.57% / 3.40%）；页面级与控制台错误 0
  - L4 相关 3 个测试文件共 62 例通过（modelPrecision 20 / acceptance-lib 14 / tools 28，2026-10-23 复测）
  - e2e panorama-l4 3 条通过（默认加载 / 切换 / 回落）；typecheck 0
  - 全仓 135 文件 / 1242 例通过（2026-10-22 19:04 复测）
  - 占位资产在 UI、文档、证据三处显式标注，任何证据不得表述为真实 L4 精度
  - 真实交付包核验：合规包 → `needs_human`（0 error，精度留人工）；缺 license/crs/qa/控制点/覆盖 → fail；SIMULATED 默认 fail（须显式允许）
  - 全链路演练：`node tools/l4/chain-dryrun.mjs` → 9 步 / 10 断言全过（2026-10-23，不依赖登录/UI）
