id: F-028
name: plane-gpcf-feature-evidence-integration
project: project
status: done
goal: 建立 GlobalCloud Project 独立项目，并以 Plane 社区版只读对接 GPCF Feature 与 Evidence 状态
owner: GPCF
priority: P1
scope:
  in:
    - Plane 社区版独立源码与许可基线
    - GPCF Feature/Evidence 只读 API 投影与本地预览
    - 项目群 25 项目纳管和双主控方案继承
  out:
    - 共享或生产 Plane 实例写入与对外发布
    - GPCF 状态回写或验收状态提升
