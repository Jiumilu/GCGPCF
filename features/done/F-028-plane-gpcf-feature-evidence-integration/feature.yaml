  - 本机 Plane API 首次创建及重复同步更新同一工作项，GPCF 源文件哈希不变
  - F-028 Evidence Gate 记录本地结果与 Plane 实例验证边界
loop:
  current_step: commit
  iteration: 4
evidence:
  tests: pass
  build: pass
  screenshots: waived
  api: pass
  summary: pass
blockers:
verification:
  tests:
  - python3 -m unittest discover -s '../GlobalCloud PMC' -p test_gpcf_sync.py
  build:
  - python3 -X pycache_prefix=/private/tmp/gcproject-pycache -m py_compile '../GlobalCloud PMC/globalcloud/gpcf_sync.py'
  api:
  - python3 '../GlobalCloud PMC/globalcloud/gpcf_sync.py' --feature F-028 --dry-run
  waivers:
