completion_rules:
  - human_decision只能为designate_authority或keep_unknown
  - 选择designate_authority时，除current_state和target_ids外的全部指定字段必须非空
  - valid_from与valid_until必须为明确时间，且valid_until晚于valid_from
  - signed_thread_or_identity必须能够绑定被指定主体或其正式代表
  - 同一主体覆盖多个分组时仍须逐组明确scope、受众、敏感边界和有效期
  - 选择keep_unknown时不得填写虚构权威主体，该组继续进入例外队列
  - 任一字段缺失、相互冲突或依据不可验证时，该组保持UNKNOWN
