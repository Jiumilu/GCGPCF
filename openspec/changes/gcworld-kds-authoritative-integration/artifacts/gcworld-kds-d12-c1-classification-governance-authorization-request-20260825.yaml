  purpose: 在不读取KDS正文的条件下建立可审计数据等级决定或继续UNKNOWN
  responsible_reviewers:
    reviewer_a:
      role: KDS数据分级与安全责任方
      responsibility: 根据既有访问空间、生成责任、元数据和保留义务独立提出S1、S2、S3或UNKNOWN
    reviewer_b:
      role: 对应内容权威方或项目群知识工程责任方
      responsibility: 根据来源责任、目标受众、业务敏感性和既有治理记录独立提出S1、S2、S3或UNKNOWN
  allowed_evidence:
    - D12-R1已密封的路径、Git状态、文件类型、权限模式、字节数、纳秒时间、inode和SHA256
    - 已完成责任归属回执中的生成责任、运行关系、保留义务和历史风险结论
    - 同一字节摘要与已分级对象的一致性关系，但只能作为辅助证据
    - 两位责任方新增的签名式分类声明、理由码、适用范围和有效期
  prohibited_evidence:
    - 任一目标文件正文、frontmatter、结构化字段、局部片段、字符串、关键词或语义摘要
    - 通过先读取正文再删除输出的方式生成分类
    - 仅凭文件名、目录名、扩展名、相似度或智能体猜测形成较低等级
  decision_rule:
    - 两位责任方均给出相同S1或S2且理由、范围和有效期完整时，形成待登记分类
    - 任一责任方判定S3时从严记录为S3，并仅保存不透明标识、受控指针和审计信息
    - 两位责任方分类不同、证据不足或任一方UNKNOWN时，结果保持UNKNOWN并进入例外队列
    - 相同SHA只能证明字节一致；未经责任方确认不得自动继承已分级对象等级
    - 分类结果只更新GPCF治理附录和候选分级清单，不写入KDS
  required_output:
    - 每条路径的reviewer_a决定、reviewer_b决定、理由码、有效期和最终裁决
    - 每条路径是否仍需D12-C2高风险分类授权
    - S3项目仅输出不透明标识和最小审计字段，不输出可推断正文的摘要
    - 审阅前后31项基线、严格元数据和冻结状态
    - 中文回执及零KDS正文读取、零KDS写入、零测试、零服务操作声明
