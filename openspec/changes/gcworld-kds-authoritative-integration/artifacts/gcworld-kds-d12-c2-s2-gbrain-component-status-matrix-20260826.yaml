  proposed_first_action_after_separate_approval:
    - 仅暂停并卸载com.gbrain.autopilot，验证Autopilot及jobs worker均消失
    - 不操作com.globalcloud.gbrain、审计代理、KDS服务或其他任务登记
    - 验证三个主链路监听进程仍在且KDS Git基线零漂移
  deferred_actions:
    - 由责任方确认com.globalcloud.gbrain与com.gbrain.autopilot是否重复或代际替代关系
    - 逐项清理Hermes暂停任务的陈旧next_run_at及三项错误状态
    - 选择一个同步任务作为后续独立授权的单一金丝雀，不批量恢复
