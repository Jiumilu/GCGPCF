decision_rule:
  - 只有逐项权威主体身份与授权依据可验证且全部必填字段完整时，才能形成待登记分类候选
  - 权威主体提出UNKNOWN、拒绝声明、未回应、声明过期、scope不清或valid_until缺失时，最终继续UNKNOWN
  - KDS安全责任方只验证声明治理完整性，不以路径、模式、大小、摘要或智能体判断替代内容权威主体
  - 任一S3建议从严记录为S3候选，但只能保留不透明标识、受控指针和最小审计字段
  - D12-C2分类候选仍不得触发正文读取、D12-R2或任何文件处置；后续必须另行申请
