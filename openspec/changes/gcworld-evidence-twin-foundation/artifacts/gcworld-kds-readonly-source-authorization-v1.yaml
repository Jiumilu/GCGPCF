  human_decision_owner_display_name: 老卢
  human_decision_owner_ref: human://globalcloud/project-sponsor/current-user
  responsibility: 身份归一、身份合并和关系争议的最终人工裁决
  temporary_assignment: true
  delegation_allowed: false
