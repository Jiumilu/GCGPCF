schema: spec-driven

context: |
  GlobalCloud uses Program to set direction, Project to manage cadence, Feature to deliver, Loop to serve execution, and Evidence to retain results.
  Every implementation change must bind to a GPCF Feature under features/active/F-xxx and preserve traceability through journal.md and evidence/.
  GKE-001 is the cross-repository GlobalCloud Knowledge Engineering domain. Its authoritative OpenSpec Program binding is governance/openspec/gke001-program-binding.yaml and its CodeGraph domain binding is governance/codegraph/gke001-engineering-domain-binding.yaml.
  Every GKE-001 change must identify its Release, F-013 or successor canonical Feature, target repository, owner, thread, baseline, bounded file scope, CodeGraph impact, authorization boundary, and rollback.
  OpenSpec completion or archive does not imply accepted, integrated, production_ready, or customer_accepted; Harness Governance owns final status decisions and human confirmation remains mandatory.

rules:
  proposal:
    - Identify affected Program, Project, Feature, repositories, dependencies, non-goals, and rollback boundary.
    - For GKE-001, identify the Release and whether CodeGraph domain relationships change.
  design:
    - Describe Feature binding, evidence production, document control, and Harness handoff.
    - For GKE-001, preserve KDS as the knowledge source of truth and distinguish governance indexing from runtime integration.
  tasks:
    - Include applicable implementation, test, build, lint, evidence, document gate, spec sync, and rollback tasks.
    - For GKE-001, include deterministic Program and CodeGraph binding validation when either mapping changes.
    - Do not treat task checkbox completion as delivery or acceptance evidence.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
