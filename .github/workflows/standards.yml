# GlobalCloud 项目群统一规范 · GitHub Actions 模板
# 用法：
#   1. 项目群治理仓（本工作区被纳入 git 时）放 .github/workflows/standards.yml；
#   2. 各项目仓如需单独门禁，可复制本文件，但需把 GC_WORKSPACE 指向已检出项目群工作区的 runner 路径；
#   3. 运行器需具备完整工作区（self-hosted runner），因为规范检查跨 35+ 仓。
name: globalcloud-standards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: 统一规范检查（R01-R20）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      # self-hosted runner 上项目群工作区的绝对路径；可在仓库 Variables 覆盖
      GC_WORKSPACE: ${{ vars.GC_WORKSPACE || '/Users/lujunxiang/Projects/GlobalCloud V0.0.1' }}
    steps:
      - name: 校验工作区与检查器
        run: |
          test -d "$GC_WORKSPACE/_governance"
          test -f "$GC_WORKSPACE/_governance/tools/gc_standard.py"
          python3 --version

      - name: 统一规范检查（error 阻断）
        run: |
          cd "$GC_WORKSPACE"
          python3 _governance/tools/gc_standard.py check \
            --fail-on error \
            --json --json-out "$RUNNER_TEMP/gc-standard.json"

      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-standard-json
          path: ${{ runner.temp }}/gc-standard.json
          if-no-files-found: ignore
          retention-days: 30
