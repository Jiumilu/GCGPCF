# 项目群统一规范检查（G3 远端门）
# 检查器与规则来自本仓 `.standards/` 内嵌快照（由 _governance/tools/sync_vendor.py 生成，勿手改）
name: globalcloud-standards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: 统一规范检查（R01-R20）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          lfs: false

      - name: 组装检查工作区（内嵌快照，无跨仓访问）
        run: |
          set -e
          REPO_NAME="GlobalCloud GPCF"
          WS="$RUNNER_TEMP/ws"
          mkdir -p "$WS/GlobalCloud GPCF/config"
          cp -R repo/.standards "$WS/_governance"
          cp repo/.standards/registry/project-group-projects.yaml "$WS/GlobalCloud GPCF/config/"
          cp -R repo "$WS/$REPO_NAME"
          echo "workspace ready: $WS"

      - name: 统一规范检查（error 阻断）
        run: |
          set -e
          WS="$RUNNER_TEMP/ws"
          python3 "$WS/_governance/tools/gc_standard.py" check             --repo "$REPO_NAME"             --fail-on error --json-out "$RUNNER_TEMP/gc-standard.json" || exit 1
        env:
          REPO_NAME: "GlobalCloud GPCF"

      - name: 上传检查证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-standard-json
          path: ${{ runner.temp }}/gc-standard.json
          if-no-files-found: ignore
          retention-days: 30
