name: GPCF repository governance

on:
  pull_request:
  push:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - run: python tools/kds-sync/document_control.py --check
      - run: python tools/kds-sync/check_document_pollution.py
      - run: python tools/kds-sync/check_chinese_localization_gate.py
      - run: python tools/kds-sync/validate_gpcf_2_feature_workspace.py
      - run: python tools/kds-sync/check_python_bytecode.py
