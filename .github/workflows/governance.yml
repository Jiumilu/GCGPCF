name: GPCF repository governance

on:
  pull_request:
  push:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      # 构建自检（P16-2）：以 AST 语法解析代替 compileall——本仓存在超长文件名，
      # compileall 会写出超出文件名长度上限的 .pyc 而失败；AST 解析无产物、等价校验语法。
      - name: 构建自检（语法解析，无产物）
        run: |
          python - <<'PYEOF'
          import ast, pathlib, sys
          SKIP = {".venv", "node_modules", ".next", "dist", "build", "__pycache__"}
          bad, n = [], 0
          for p in pathlib.Path(".").rglob("*.py"):
              if SKIP & set(p.parts):
                  continue
              n += 1
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as exc:
                  bad.append(f"{p}:{exc.lineno}: {exc.msg}")
          print(f"语法解析 {n} 个 .py 文件，失败 {len(bad)}")
          for b in bad[:20]:
              print(" -", b)
          sys.exit(1 if bad else 0)
          PYEOF
      - run: python tools/kds-sync/loop_document_gate.py --check-only --repository-only
      - run: python tools/kds-sync/check_python_bytecode.py

  gpcf-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      # 文档闸：本地 KDS 镜像元数据与 doc_id 一致性
      - run: python tools/kds-sync/document_control.py --check
      # 证据闸：Evidence 规则版本 + 授权台账 + 契约矩阵
      - run: python tools/kds-sync/validate_evidence_rule_version.py
      - run: python tools/kds-sync/validate_project_group_caliber_baseline.py
      - run: python tools/kds-sync/validate_vu_ledger.py
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
        continue-on-error: true
      - run: python tools/kds-sync/measure_asset_reuse.py
        continue-on-error: true   # CI 无兄弟仓，跨仓计数为 0；本地运行才有跨仓
      - run: python tools/kds-sync/validate_asset_reuse.py
      - run: python tools/kds-sync/validate_token_source_exceptions.py
        continue-on-error: true   # 首次进 CI：依赖项目群口径文件，先观察
      - run: python tools/kds-sync/validate_project_group_single_authorization_ledger.py
      - run: python tools/kds-sync/validate_contract_matrix.py
      - run: python tools/kds-sync/validate_xap_error_code_registry.py
      - run: python tools/kds-sync/validate_contract_version_drift.py
      - run: python tools/kds-sync/validate_event_package_ref.py
      # Feature 关闭闸：queue/state 与 Feature 工作区一致性（待 Firebase/ROADMAP 存量修复后转阻断）
      - run: python tools/kds-sync/validate_gpcf_2_feature_workspace.py
