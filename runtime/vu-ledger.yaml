  C_real:
    definition: 真实口径：只计 S4–S6，S0–S3 计 0；S4/S5/S6 取 §1.2 原权重 0.70/0.90/1.00
    coefficient_field: stage_weights.*.real
  C_project: C = Σ(weight_i × coefficient(stage_i)) / Σ weight_i
  C_group: C_group = Σ(PW_j × C_j) / Σ PW_j
stage_evidence_discipline:
- 无证据 = S0
- 仅代码 / fixture / dry-run = S1
- tests / build / validator pass = S2
- evidence 包 + review 请求 = S3
- 真实 source-of-record 通过 source validation + runtime intake + review queue = S4
- 人工验收 = S5
- 闭环归档 = S6
- fixture / dry-run / mock / SIMULATED / PoC governor 最高 S2，不得进入 S4
- '无事实依据的条目填 S0/S1 并标 inferred: true'
