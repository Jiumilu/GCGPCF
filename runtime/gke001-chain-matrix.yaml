  S2: 有本地实现与可回放证据（含 run 记录 / validator / freeze 记录），未完成跨仓联调与独立评审
  S3: 跨仓联调与独立评审证据齐备（仍不等于 accepted，不构成授权或状态提升）
  pending: 等待上游环节或人工授权，当前无法推进
