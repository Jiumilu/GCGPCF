      - 01-architecture/XAP回执与执行报告规格草案_v0.1.md
      - ../GlobalCloud WAME/server/xap-intake/intake_core.py
      - ../GlobalCloud XWAIL/scripts/xap_sign.py
      - ../GlobalCloud XiaoC/docs/integration/wame-formal-registration-number-proposal.md
