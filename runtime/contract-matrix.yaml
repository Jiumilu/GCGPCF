    severity: high
    contracts: [CONTRACT-XAP-GOVERNANCE-EXCHANGE, CONTRACT-KNOWLEDGE-ASSET-CANONICAL]
    description: >-
      同一摘要概念在四处有四种定义：①XAP 回执规格把 packageRef.contentDigest 作为请求包摘要并进幂等键；
      ②WAME 受理实现按 sha256(contents) 实算并比对信封自称值，不一致即 XAP-2004 拒收；
      ③XWAIL xap_sign 的签名对象是逐文件 sha256 汇总的 totalSha256，payload 为
      'xap-sign-v1|packageId|version|totalSha256'；④XiaoC 正式注册提案明确要求 contentDigest 绑定
      AaaS ServicePackage 包体 canonical SHA-256，并写明不得复用 PoC 请求信封 digest。
