  - conflict_id: CONFLICT-05
    topic: XAP 签名与无签名边界
    severity: high
    contracts: [CONTRACT-XAP-GOVERNANCE-EXCHANGE]
    description: >-
      XAP 回执规格把 signature 定为可选位并在 P2 预留；xap-manifest.schema.json 完全没有 signature / digest 定义，
      只靠 additionalProperties: true 放行；XWAIL 已有 xap_sign.py（Ed25519）与 xap_verify.py 实现；
      而 F-033 验收项写的是「XWAIL 包完整性通过（无签名）」。即：工具已能签，PoC 明确接受无签名，
      正式治理是否要求签名、验签失败如何处置均未冻结。
    evidence:
      - 01-architecture/XAP回执与执行报告规格草案_v0.1.md
      - ../GlobalCloud XWAIL/schemas-json/xap-manifest.schema.json
      - ../GlobalCloud XWAIL/scripts/xap_sign.py
      - features/active/F-033-r1-ecosystem-integration/feature.yaml
    impact: 无签名包与签名包在受理台账里无法区分强度，回执的 authority 与完整性证据可能被当成同一等级证据。
    recommendation: 在 manifest Schema 显式加 signature 与 digest 定义（可选但可判），台账记录 signature_status；正式治理受理要求签名，PoC 受理标注 no_signature 且不得作为治理证据。
    status: open
    inferred: false

